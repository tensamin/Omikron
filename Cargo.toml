[package]
name = "omikron"
version = "0.1.0"
edition = "2024"

[dependencies]
tau = { git = "https://github.com/TensaminDev/Tau.git", rev = "ccbdcb81df00d626da16071c4c8b0b1ec803f87c" }
iota-opaque = { git = "https://github.com/TensaminDev/Iota.git", rev = "060387affdef2c683aa1e87f31fbfc1e3ff7ccf4" }
libc = "0.2"
mtp = { git = "https://github.com/Nonanium/MTP.git", rev = "87c535650a3a33b166139b02cdd7327d412d3bca", features = [
    "web-server",
    "client",
    "crypto",
    "files",
    "raw",
] }
mtp-native = { git = "https://github.com/Nonanium/MTP.git", rev = "87c535650a3a33b166139b02cdd7327d412d3bca" }

ansi_term = "0.12.1"
uuid = { version = "1.24.0", features = ["v4"] }
base64 = "0.22.1"
dashmap = "6.2.1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
once_cell = "1.21.4"
rand = "0.10.2"
rustls = { version = "0.23.42", default-features = false, features = [
    "std",
    "tls12",
    "aws-lc-rs",
    "prefer-post-quantum",
] }
tokio = { version = "1.53.0", features = ["full"] }
dotenv = "0.15.0"
strum_macros = "0.28.0"
livekit-api = { version = "0.5.6", features = ["rustls-tls-native-roots"] }
livekit-protocol = "=0.7.10"
thiserror = "2.0.19"
trust-dns-resolver = "0.23.2"
serde_json = "1.0.151"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
rusqlite = { version = "0.37", features = ["bundled"] }

[dev-dependencies]
rcgen = "0.14"
