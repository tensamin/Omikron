[package]
name = "omikron"
version = "0.1.0"
edition = "2024"

[dependencies]
libc = "0.2"
mtp = { git = "https://git.methanium.net/Methanium/mtp.git", rev = "bb0f682b735de5ebb36bb41dc699260578341828", features = [
    "web-server",
    "client",
    "crypto",
    "files",
    "raw",
] }
mtp-native = { git = "https://git.methanium.net/Methanium/mtp.git", rev = "bb0f682b735de5ebb36bb41dc699260578341828" }

ansi_term = "0.12.1"
uuid = { version = "1.24.0", features = ["v4"] }
base64 = "0.22.1"
dashmap = "6.2.1"
http = "1"
once_cell = "1.21.4"
rand = "0.10.2"
rustls = { version = "0.23.42", default-features = false, features = [
    "std",
    "tls12",
    "aws-lc-rs",
    "prefer-post-quantum",
] }
tokio = { version = "1.53.0", features = ["full"] }
dotenv = "0.15.0"
strum_macros = "0.28.0"
livekit-api = { version = "0.5.6", features = ["rustls-tls-native-roots"] }
livekit-protocol = "=0.7.10"
thiserror = "2.0.19"
trust-dns-resolver = "0.23.2"
serde_json = "1.0.151"
serde = { version = "1", features = ["derive"] }
